<div class="row p-0 m-0">
  <div class="col-md-11 p-0 m-0">
    <mat-form-field class="example-full-width me-2" appearance="fill">
      <mat-label>Filtro por semana</mat-label>
      <input matInput [matDatepicker]="picker" (dateChange)="getWeekNumber($event)" >
      <!-- <mat-hint>DD/MM/YYYY</mat-hint> -->
      <mat-datepicker-toggle matIconSuffix [for]="picker">
        <mat-icon matDatepickerToggleIcon>keyboard_arrow_down</mat-icon>

      </mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
    <button mat-mini-fab color="primary"  aria-label="reset" (click)="reset()">
      <mat-icon>home</mat-icon>
    </button>
  </div>
</div>
