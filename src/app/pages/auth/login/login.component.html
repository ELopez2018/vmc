<section class="login">
  <div class="login__brand">
    <div>
      <p class="login__eyebrow">Vida y Ministerio Cristianos</p>
      <h1>Bienvenido</h1>
    </div>
    <img class="login__logo" src="assets/img/Logo.png" alt="VMC">
  </div>

  @if (!showSpinner) {
  <form class="login__form" [formGroup]="credential" (ngSubmit)="login()">
    <div class="login__form-head">
      <span>Acceso seguro</span>
      <strong>Ingresa a tu cuenta</strong>
    </div>

    <label class="login__field" for="username">
      <span>Usuario</span>
      <input
        id="username"
        formControlName="username"
        type="text"
        autocomplete="username"
        placeholder="Escribe tu usuario"
        class="form-control"
      >
    </label>

    <label class="login__field" for="password">
      <span>Contraseña</span>
      <input
        id="password"
        formControlName="password"
        type="password"
        autocomplete="current-password"
        placeholder="Escribe tu contraseña"
        class="form-control"
      >
    </label>

    @if (errorMessage) {
    <mat-error class="login__error">
      {{ errorMessage }}
    </mat-error>
    }

    <button class="btn btn-primary login__button" type="submit" [disabled]="credential.invalid">
      Ingresar
    </button>
  </form>
  }
</section>
