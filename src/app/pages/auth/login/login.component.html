<div class="login">
  <div class="container-fluid">
    <div class="row bg-primary text-white py-2 mb-5">
      <div class="col-md-12">
        <h4>Ingresar al Sistema</h4>
      </div>
    </div>
    <div class="row mb-4" [formGroup]="credential" *ngIf="!showSpinner">
      <div class="col-md-1"></div>
      <div class="col-md-10">
        <input id="username" formControlName="username"  type="text" placeholder="Usuario" class="form-control mb-2">
        <input id="password" formControlName="password" type="password" placeholder="Contraseña" class="form-control">
        <mat-error *ngIf="error">
          El usuario y/o la contraseña no son válidos
        </mat-error>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12 d-flex justify-content-center">
        <mat-spinner *ngIf="showSpinner"></mat-spinner>
      </div>
    </div>
    <div class="row" *ngIf="!showSpinner">
      <div class="col-md-12  d-flex justify-content-center">
        <button class="btn btn-primary px-5" (click)="login()"  >Ingresar</button>
      </div>
    </div>
  </div>
</div>
