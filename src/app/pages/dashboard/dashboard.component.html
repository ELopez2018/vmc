<div
  class="example-container"
  [class.example-is-mobile]="mobileQuery.matches"
  *ngIf="shouldRun"
>
  <mat-toolbar color="primary" class="example-toolbar">
    <button mat-icon-button (click)="snav.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
    <h1 class="example-app-name">Programa para la reunión de entre semana</h1>
  </mat-toolbar>

  <mat-sidenav-container
    class="example-sidenav-container"
    [style.marginTop.px]="mobileQuery.matches ? 56 : 0"
  >
    <mat-sidenav
      #snav
      [opened]="true"
      [mode]="mobileQuery.matches ? 'over' : 'side'"
      [fixedInViewport]="mobileQuery.matches"
      fixedTopGap="100"
    >
      <mat-nav-list>
        <a mat-list-item routerLink="entre-semana"> Programa</a>
        <a mat-list-item routerLink="imprimir">Imprimir</a>
        <a mat-list-item routerLink="publicadores">Publicadores</a>
        <a mat-list-item routerLink="publicador">Publicador</a>
        <a mat-list-item routerLink="privilegios">Privilegios</a>
        <a mat-list-item (click)="logout()">Salir</a>
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content>
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
