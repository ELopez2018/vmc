<ng-template #filtersModal>
  <div class="program-filter-modal">
    <div class="program-filter-modal__header">
      <h5 class="program-filter-modal__title">Buscar programas</h5>
      <button type="button" class="btn-close" aria-label="Cerrar" (click)="closeFiltersModal()"></button>
    </div>
    <div class="program-filter-modal__body">
      <vmc-program-filters (filter)="onFiltersSelected($event)"></vmc-program-filters>
    </div>
  </div>
</ng-template>

<div class="program">
  <div class="container-wrapper p-0 p-md-1">
    <div class="wrapper">
      @for (semana of semanasAllRooms; track semana.id; let first = $first) {
      <vmc-program-week
        [semana]="semana"
        [weeks]="semanasAllRooms"
        [roomA]="RoomA"
        [showPresidentTooltip]="first"
        [room]="room"
        [isAdmin]="isAdmin"
        [porAsignar]="porAsignar"
        [meetingDay]="meetingDay"
        (print)="print($event)"
        (printAssignments)="printAssig($event)"
        (openFilters)="openFiltersModal(filtersModal)"
        (programChange)="changeProgram($event.program, $event.type)"
        (weeklyProgramChange)="changeWeeklyProgram($event.item, $event.type)"
        (addAssignment)="addAssign($event.program, $event.sectionMeeting)"
      ></vmc-program-week>
      }
    </div>
  </div>
</div>
