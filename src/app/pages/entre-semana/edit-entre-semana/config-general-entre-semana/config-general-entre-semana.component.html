<div class="container-fluid">
  <div class="row">
    <div class="col-md-4 h2">Numero de semana: {{ week.weekNumber }}</div>
    <div class="col-md-4 h2">Semana del {{ week.week }}</div>
    <div class="col-md-4 h2">Dia de la reunion: {{ showDayOfMeeting(week.week) }}</div>
  </div>
  <div class="row">
    <div class="col-md-12">
      <table class="table">
        <thead class="table-primary">
          <tr>
            <th scope="col" class="text-center">Cancion inicial</th>
            <th scope="col" class="text-center">Oracion inicial</th>
            <th scope="col" class="text-center">Presidente</th>
            <th scope="col" class="text-center">Consejero Auxiliar</th>
            <th scope="col" class="text-center">Cancion Intermedia</th>
            <th scope="col" class="text-center">Cancion Final</th>
            <th scope="col" class="text-center">Oracion Final</th>
            <th scope="col" class="text-center"></th>
          </tr>
        </thead>

        <tbody>
          <tr [formGroup]="form">
            <td class="">
              <input
                type="text"
                name="openingSong"
                formControlName="openingSong"
                class="form-control sizeMin500px text-center"
                aria-label="Username"
                aria-describedby="basic-addon1"
              />
            </td>
            <td class="text-center">
              <div class="input-group mb-3">
                <input
                  type="text"
                  class="form-control"
                  aria-label="openingPrayer"
                  aria-describedby="button-addon2"
                  [value]="openingPrayer"
                />
                <button
                  class="btn btn-outline-secondary"
                  type="button"
                  id="button-addon2"
                  (click)="assigOpeningPrayer()"
                >
                  <mat-icon>person_add</mat-icon>
                </button>
              </div>
            </td>
            <td class="text-center">
              <div class="input-group mb-3">
                <input
                  type="text"
                  class="form-control"
                  aria-label="president"
                  [value]="president"
                  aria-describedby="button-addon2"
                  (click)="assigPresident()"
                />
                <button
                  class="btn btn-outline-secondary"
                  type="button"
                  id="button-addon2"
                  (click)="assigPresident()"
                >
                  <mat-icon>person_add</mat-icon>
                </button>
              </div>
            </td>
            <td class="text-center">
              <div class="input-group mb-3">
                <input
                  type="text"
                  class="form-control"
                  aria-label="assistantAdviser"
                  aria-describedby="button-addon2"
                  [value]="assistantAdviser"
                  (click)="assigAssistantAdviser()"
                />
                <button
                  class="btn btn-outline-secondary"
                  type="button"
                  id="button-addon2"
                  (click)="assigAssistantAdviser()"
                >
                  <mat-icon>person_add</mat-icon>

                </button>
              </div>
            </td>
            <td class="text-center">
              <input
                type="text"
                name="timeType"
                formControlName="intermediateSong"
                class="form-control size50px text-center"
                aria-label="Username"
                aria-describedby="basic-addon1"
              />
            </td>
            <td class="text-center">
              <input
                type="text"
                name="finalSong"
                formControlName="finalSong"
                class="form-control size50px text-center"
                aria-label="finalSong"
                aria-describedby="basic-addon1"
              />
            </td>
            <td class="text-center">
              <div class="input-group mb-3">
                <input
                  type="text"
                  class="form-control"
                  aria-label="finalPrayer"
                  aria-describedby="button-addon2"
                  [value]="finalPrayer"
                  (click)="assigFinalPrayer()"
                />
                <button
                  class="btn btn-outline-secondary"
                  type="button"
                  id="button-addon2"
                  (click)="assigFinalPrayer()"
                >
                  <mat-icon>person_add</mat-icon>
                </button>
              </div>
            </td>
            <td>
              <button
                mat-icon-button
                (click)="save()"
                type="button"
                class="btn btn-primary"
              >
                <mat-icon>save</mat-icon>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
