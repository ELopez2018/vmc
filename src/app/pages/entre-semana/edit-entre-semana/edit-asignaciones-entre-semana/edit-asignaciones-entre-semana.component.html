<div class="container-fluid pb-5">
  <div class="row">
    <div class="col-md-12">
      <table class="table">
        <thead class="table-primary">
          <tr>
            <!-- <th scope="col" class="text-center">Id</th> -->
            <th scope="col" class="text-center">No</th>
            <th scope="col" class="text-center">Titulo</th>
            <th scope="col" colspan="1" class="text-center">Tiempo</th>
            <th scope="col" class="text-center"></th>
            <th scope="col" class="text-center">Responsable</th>
            <th scope="col" class="text-center">Ayudante</th>
            <th scope="col" colspan="1" class="text-center">Seccion</th>
            <th scope="col" class="text-center">Tips</th>
            <th scope="col" class="text-center">showTips</th>
            <th scope="col" class="text-center"></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of assignmentList">
            <!-- <td class="text-center">
              <span>{{ item.id }}</span>
            </td> -->
            <td class="text-center">
              <input
                type="text"
                name="number"
                [(ngModel)]="item.number"
                class="form-control size50px"
                placeholder="number"
                aria-label="number"
                aria-describedby="number"
              />
            </td>
            <td class="">
              <input
                type="text"
                name="title"
                [(ngModel)]="item.title"
                class="form-control sizeMin500px"
                placeholder="title"
                aria-label="title"
                aria-describedby="title"
              />
            </td>
            <td class="text-center">
              <input
                type="text"
                name="time"
                [(ngModel)]="item.time"
                class="form-control size50px"
                placeholder="time"
                aria-label="time"
                aria-describedby="time"
              />
            </td>
            <td class="text-center">
              <input
                type="text"
                name="timeType"
                [(ngModel)]="item.timeType"
                class="form-control size50px"
                placeholder="mins, Hrs."
                aria-label="timeType"
                aria-describedby="timeType"
              />
            </td>
            <td class="text-center">

              <div class="input-group mb-3">
                <input   [value]="item.responsible?.fullName" type="text" class="form-control"  aria-label="responsible" aria-describedby="button-addon2">
                <button class="btn btn-outline-secondary"(click)="assigResponsible(item)"  type="button" id="button-addon2"><mat-icon>person_add</mat-icon></button>
              </div>
              <!-- <select
                [(ngModel)]="item.responsible"
                class="form-select form-select-sm"
                aria-label="Small select example"
              >
                <option value="" disabled selected>Seleccione</option>
                <option *ngFor="let item of publishers" [ngValue]="item">
                  {{ item.fullName }}
                </option>
              </select> -->
              <!-- <span>{{ item.responsible }}</span> -->
            </td>
            <td class="text-center">
              <div class="input-group mb-3">
                <input   [value]="item.assistant?.fullName" type="text" class="form-control"  aria-label="responsible" aria-describedby="button-addon2">
                <button class="btn btn-outline-secondary"(click)="assigAssistant(item)" type="button" id="button-addon2"><mat-icon>person_add</mat-icon></button>
              </div>
              <!-- <select
                [(ngModel)]="item.assistant"
                class="form-select form-select-sm"
                aria-label="Small select example"
              >
                <option selected>Selecciones</option>
                <option [ngValue]="item" *ngFor="let item of publishers">
                  {{ item.fullName }}
                </option>
              </select> -->
              <!-- <span>{{ item.assistant }}</span> -->
            </td>
            <td class="text-center pt-3">
              <span
                class="badge py-2"
                [title]="item.sectionMeeting"
                [ngClass]="{
                  'text-bg-success':
                    item.sectionMeeting == 'TESOROS DE LA BIBLIA',
                  'text-bg-warning':
                    item.sectionMeeting == 'SEAMOS MEJORES MAESTROS',
                  'text-bg-danger':
                    item.sectionMeeting == 'NUESTRA VIDA CRISTIANA'
                }"
                >{{ changeSeccion(item.sectionMeeting) }}</span
              >
              <span></span>
            </td>
            <td class="text-center">
              <input
                type="text"
                name="tips"
                [(ngModel)]="item.tips"
                class="form-control"
                aria-label="Username"
                aria-describedby="basic-addon1"
              />
              <!-- <span>{{ item.tips }}</span> -->
            </td>
            <td class="text-center pt-3">
              <div class="form-switch text-center">
                <input
                  class="form-check-input"
                  [(ngModel)]="item.showTips"
                  type="checkbox"
                  role="switch"
                  id="flexSwitchCheckDefault"
                />
              </div>
            </td>
            <td class="">
              <button
                (click)="update(item)"
                mat-icon-button
                type="button"
                class="btn btn-primary"
              >
                <mat-icon>save</mat-icon>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
