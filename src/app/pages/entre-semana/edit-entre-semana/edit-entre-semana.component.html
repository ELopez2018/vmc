
<div class="wrapper">
  <vmc-config-general-entre-semana
  *ngIf="semana"
  [week]="semana"
  [publishers]="publishers"
  >
  </vmc-config-general-entre-semana>

  <vmc-edit-asignaciones-entre-semana
  *ngIf="semana && semana.assignments && semana.assignments.length > 0"
  [assignmentList]="semana.assignments"
  [week]="semana"
  (onGetPublishers)="setPublishers($event)"
  >
  </vmc-edit-asignaciones-entre-semana>
</div>
