<div class="entre-semana">
  <div class="container-fluid">
    <div class="row my-1 py-3 shadow-titles">
      <div class="col-md-9 text-center text-md-start">
        <h5>
          Bienvenido {{ Superintendente.fullName }} - Congregación
          {{ Superintendente.congregation.name }}
        </h5>
      </div>
      <div class="col-md-3 text-center">
        <img
          class="hover me-3"
          src="../../../assets/img/actualizar.png"
          width="30px"
          alt=""
          (click)="getPrograms()"
          title="Actualiza el programa"
        />
        <a routerLink="/tablero/imprimir"
        (click)="goToPrint()"
        >
          <img src="../../../assets/img/imprimir.png" width="30px" alt=""
          title="Imprime todas las semana"
        /></a>
      </div>
    </div>
  </div>

  <mat-tab-group animationDuration="0ms">
    <mat-tab label="Principal">
      <div class="container mt-5 pt-5" *ngIf="showSpinner">
        <div class="row mt-5 pt-5">
          <div class="col-md-5"></div>
          <div class="col-md-2 text-center mt-5">
            <mat-spinner></mat-spinner>
          </div>
          <div class="col-md-5"></div>
        </div>
      </div>
      <vmc-programs [semanas]="semanas" [RoomA]="true" [room]="'A'"></vmc-programs>
    </mat-tab>
    <mat-tab label="Auxiliar">
      <vmc-programs
        [semanas]="semanasSalaAuxiliar"
        [RoomA]="false"
        [room]="'B'"
      ></vmc-programs>
      <div class="container mt-5 pt-5" *ngIf="showSpinner">
        <div class="row mt-5 pt-5">
          <div class="col-md-5"></div>
          <div class="col-md-2 text-center mt-5">
            <mat-spinner></mat-spinner>
          </div>
          <div class="col-md-5"></div>
        </div>
      </div>
    </mat-tab>
  </mat-tab-group>
</div>
