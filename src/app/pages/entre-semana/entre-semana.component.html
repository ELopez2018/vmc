<div class="entre-semana">
  <mat-tab-group class="entre-semana__rooms" animationDuration="0ms" [preserveContent]="true"
    (selectedIndexChange)="selectedRoomTab = $event">
    <mat-tab label="Principal">
      <ng-template matTabContent>
        <vmc-programs [semanas]="semanas" [semanasAllRooms]="semanasAllRooms"
          [RoomA]="true" [room]="meetingRoom.MAIN" [collapseSourcesByDefault]="true"
          (filtrar)="consultar($event)"></vmc-programs>
      </ng-template>
    </mat-tab>
    <mat-tab label="Sala principal">
      <ng-template matTabContent>
        <vmc-programs [semanas]="semanas" [semanasAllRooms]="semanasSalaPrincipalVista"
          [RoomA]="true" [room]="meetingRoom.MAIN" [readOnly]="true"></vmc-programs>
      </ng-template>
    </mat-tab>
    <mat-tab label="Sala auxiliar">
      <ng-template matTabContent>
        <vmc-programs [semanas]="semanas" [semanasAllRooms]="semanasSalaAuxiliarVista"
          [RoomA]="true" [room]="meetingRoom.AUXILIARY" [readOnly]="true"></vmc-programs>
      </ng-template>
    </mat-tab>
  </mat-tab-group>

  @if (hasStoredDateFilter && selectedRoomTab === 0) {
    <button
      mat-fab
      type="button"
      class="entre-semana__clear-filter"
      aria-label="Eliminar filtro de fechas"
      matTooltip="Eliminar filtro de fechas"
      (click)="clearDateFilter()"
    >
      <mat-icon>filter_alt_off</mat-icon>
    </button>
  }
</div>
