<div class="container-fluid p-5">
  <div class="row pb-3">
    <div class="col-md-12 text-center">
      <h1>Lista de Publicadores</h1>
    </div>
  </div>

  <div class="row py-2">
    <div class="col-md-12 text-center">
      <mat-spinner *ngIf="showSpinner"></mat-spinner>
      <div class="mat-elevation-z8">
        <table mat-table [dataSource]="dataSource" matSort #sort="matSort">
          <!-- Position Column -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>No.</th>
            <td mat-cell *matCellDef="let element">{{ element.id }}</td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="fullName">
            <th mat-header-cell *matHeaderCellDef>Publicador</th>
            <td mat-cell *matCellDef="let element">{{ element.fullName }}</td>
          </ng-container>

          <!-- Weight Column -->
          <ng-container matColumnDef="cellPhone">
            <th mat-header-cell *matHeaderCellDef>Celular</th>
            <td mat-cell *matCellDef="let element">{{ element.cellPhone }}</td>
          </ng-container>

          <!-- Symbol Column -->
          <ng-container matColumnDef="gender">
            <th mat-header-cell *matHeaderCellDef>Genero</th>
            <td mat-cell *matCellDef="let element">{{ element.gender }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>

        <mat-paginator
          [pageSizeOptions]="[5, 10, 20]"
          showFirstLastButtons
          aria-label="Select page of periodic elements"
        >
        </mat-paginator>
      </div>
    </div>
  </div>
</div>
