<div class="container-fluid p-5">
  <div class="row pb-3">
    <div class="col-md-12 text-center">
      <h1>Lista de Publicadores</h1>
    </div>
  </div>

  <div class="row py-2">
    <div class="col-md-12 mb-3 text-center d-flex justify-content-center align-items-center flex-column ">
      @if (showSpinner) {
      <div class="pt-5 mt-5">
        <mat-spinner></mat-spinner>
      </div>
      } @else {
      <div class="">
        <vmc-table-primeng [publisherList]="publisherList" (onSelected)="edit($event)"
          (onDelete)="delete($event)"></vmc-table-primeng>
        <mat-paginator [pageSizeOptions]="[20, 30, 40]" showFirstLastButtons
          aria-label="Elija la pagina de Publicadores">
        </mat-paginator>
      </div>
      }
    </div>
  </div>
</div>
