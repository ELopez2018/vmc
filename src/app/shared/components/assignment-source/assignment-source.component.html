@if (hasSource) {
<div class="assignment-source" [class.assignment-source--compact]="compact">
  @if (sourceHtml) {
  <div #sourceContent class="assignment-source__content" [innerHTML]="sourceHtml" (click)="openReference($event)"></div>
  } @else {
  <p class="assignment-source__text">{{ sourceText }}</p>
  }
</div>
}
