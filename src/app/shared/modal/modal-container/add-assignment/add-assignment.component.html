<div class="add-assig mb-4">
  <div class="container-fluid">
    <h4 class="text-center p-3">Seccion {{sectionMeeting}} de la Reunión</h4>
    <form [formGroup]="formG">
      <div class="row mx-4 no-gutter">
        <div class="col-md-2">
          <div class="form-floating mb-3">
            <input type="number" formControlName="number" class="form-control" id="numero" >
            <label for="floatingInput">Numero</label>
          </div>
        </div>
        <div class="col-md-8">
          <div class="form-floating mb-3">
            <input
            type="text"
            class="form-control"
            id="title"
            list="datalistOptions"
            formControlName="title"
            >
            <label for="floatingInput">Título</label>
            <datalist id="datalistOptions" >
              <option  value="{{assignment.title}}" *ngFor="let assignment of assignmentList "></option>
            </datalist>
          </div>
        </div>
        <div class="col-md-2">
          <div class="form-floating mb-3">
            <input type="number" formControlName="time" class="form-control" id="time" >
            <label for="floatingInput">Tiempo</label>
          </div>
        </div>
      </div>

      <div class="row mx-4 no-gutter" [formGroup]="formG">
        <div class="col-md-2">
          <div class="form-floating mb-3">
            <input type="time" formControlName="start" class="form-control" id="start" >
            <label for="floatingInput">Inicio</label>
          </div>
        </div>
        <div class="col-md-8">
          <div class="form-floating mb-3">
            <input type="text" formControlName="tips" class="form-control" id="tips" placeholder="Conductor/Lector" >
            <label for="floatingInput">Tips</label>
          </div>
        </div>
        <div class="col-md-2 d-flex py-3 justify-content-evenly">
          <div class="form-check form-switch me-2">
            <input class="form-check-input" formControlName="showTips" type="checkbox" role="switch" id="flexSwitchCheckChecked" checked>
            <label class="form-check-label" for="flexSwitchCheckChecked">Mostrar Tips</label>
          </div>
          <button class="btn  btn-primary mb-3" (click)="add()" ><i class="pi pi-save"></i></button>
        </div>
      </div>
    </form>
     <div class="row mx-4">
      <div class="col-md-12">
        <div class="table-responsive">
          <table class="table table-hover table-sm table-bordered cursor-hover">
            <thead>
              <tr>
                <th class="text-center" scope="col">No</th>
                <th class="text-center" scope="col">Inicio</th>
                <th class="text-center" scope="col">Titulo</th>
                <th class="text-center" scope="col">Tiempo</th>
                <th class="text-center" scope="col"></th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of week.weeklyProgram">
                <td *ngIf="item.assignment.sectionMeeting==sectionMeeting" class="text-center" >{{ item.assignment.number}}</td>
                <td *ngIf="item.assignment.sectionMeeting==sectionMeeting" class="text-center" >{{ adapterTime(item.startTime) }}</td>
                <td *ngIf="item.assignment.sectionMeeting==sectionMeeting" >{{ item.assignment.title }}</td>
                <td *ngIf="item.assignment.sectionMeeting==sectionMeeting" class="text-center" >{{ item.assignment.time }}</td>
                <td class=" text-center" *ngIf="item.assignment.sectionMeeting==sectionMeeting">
                  <button class="btn btn-sm btn-primary me-2"><i class="pi pi-save"></i></button>
                  <button class="btn btn-sm btn-danger"><i class="pi pi-trash"></i></button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-md-12 d-flex justify-content-center">
        <button class="btn btn-primary px-4 me-2"> Guardar</button>
        <button class="btn btn-danger px-4" (click)="close()"> Cancelar</button>
      </div>
    </div>
  </div>
</div>
