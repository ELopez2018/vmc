<div [ngSwitch]="modalType">
  <div *ngSwitchDefault></div>
  <div *ngSwitchCase="typeOfModals.ASSIGN_PUB">
    <search-publisher
      (onClicked)="onClicked($event)"
      *ngIf="assignment"
    ></search-publisher>
  </div>
  <div *ngSwitchCase="typeOfModals.RESPONSIBLE">
    <app-printer></app-printer>
  </div>
  <div *ngSwitchCase="typeOfModals.PRINTER">
    <app-printer></app-printer>
  </div>
</div>
