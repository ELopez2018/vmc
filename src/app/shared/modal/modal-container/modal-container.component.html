<div [ngSwitch]="modalType">
  <div *ngSwitchDefault></div>
  <div *ngSwitchCase="typeOfModals.ASSIGN_PUB">
    <search-publisher
      (onClicked)="onClicked($event)"
      *ngIf="assignment"
      [assignment]="assignment"
      [assignmentType]="assignmentType"
    ></search-publisher>
  </div>
  <div *ngSwitchCase="typeOfModals.SELECT_HOUR">
    <select-hour (onSelected)="onClicked($event)"></select-hour>
  </div>
  <div *ngSwitchCase="typeOfModals.PRINTER">
    <app-printer></app-printer>
  </div>
  <div *ngSwitchCase="typeOfModals.TITLE_AND_TIME">
    <title-and-time
      (onClicked)="onClicked($event)"
      [assignment]="assignment"
    ></title-and-time>
  </div>
  <div *ngSwitchCase="typeOfModals.CHANGE_SONGS">
    <change-song
      [song]="song"
      (onClicked)="onClicked($event)"
      [program]="program"
    ></change-song>
  </div>
  <div *ngSwitchCase="typeOfModals.ERROR">
    <error-modal
      [type]="errorType"
      [message]="errorMessage"
      (onClicked)="onClicked($event)"
      [title]="title"
    ></error-modal>
  </div>
  <div *ngSwitchCase="typeOfModals.SUCCESS">
    <info-modal
      [type]="title"
      [message]="mensaje"
      (onClicked)="onClicked($event)"
      [title]="subTitle"
    ></info-modal>
  </div>
  <div *ngSwitchCase="typeOfModals.LOADER">
    <loader></loader>
  </div>
  <div *ngSwitchCase="typeOfModals.ADDASSIG">
    <vmc-add-assignment
    [week]="program"
    [sectionMeeting]="sectionMeeting"
    (onClosed)="close()"
    ></vmc-add-assignment>
  </div>
</div>
