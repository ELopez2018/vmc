<div class="publisher">
  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <mat-tab-group animationDuration="0ms">
          <mat-tab label="Disponibles">
            <div class="">
              <fieldset class="fieldset-basic table-container">
                <legend></legend>
                <div class="table-responsive">
                  <table
                    class="table table-hover table-sm table-bordered cursor-hover"
                  >
                    <thead>
                      <tr>
                        <th scope="col">Publicador</th>
                        <th scope="col"></th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr
                        *ngFor="let item of publishers"
                        (click)="selected(item)"
                      >
                        <td>{{ item.fullName }}</td>
                        <td class="text-center">
                          <mat-icon>check_circle</mat-icon>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </fieldset>
            </div>
          </mat-tab>
          <mat-tab label="Todos">Todos</mat-tab>
        </mat-tab-group>
      </div>
    </div>
  </div>
</div>
