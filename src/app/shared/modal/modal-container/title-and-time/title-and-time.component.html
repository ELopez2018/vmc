<div class="title-time-modal">
  <label class="title-time-modal__field">
    <span>Título</span>
    <input class="form-control" [(ngModel)]="title" placeholder="Título" type="text" name="title">
  </label>
  <label class="title-time-modal__field">
    <span>Tiempo</span>
    <input class="form-control" [(ngModel)]="time" placeholder="0.00" type="number" name="hour">
  </label>
  <button class="btn btn-primary" type="button" (click)="onClick()">Aceptar</button>
</div>
