<div class="container">
  <div class="row">
    <div class="col-md-12 py-3">
      <h1 class="text-center">PUBLICADORES DE LA CONGREGACION</h1>
    </div>
  </div>
  <div class="row">
    <div class="col-md-12">
      <div class="table-responsive">
        <table class="table table-hover table-bordered cursor-hover">
          <thead>
            <tr>
              <th scope="col">fullName</th>
              <th scope="col">email</th>
              <th scope="col"></th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of publishers" (click)="selected(item)" >
              <td>{{ item.fullName }}</td>
              <td>{{ item.email }}</td>
              <td class="text-center"><mat-icon>check_circle</mat-icon></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
