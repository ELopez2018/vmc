<ng-template #filtersModal>
  <div class="program-filter-modal">
    <div class="program-filter-modal__header">
      <h5 class="program-filter-modal__title">Buscar programas</h5>
      <button type="button" class="btn-close" aria-label="Cerrar" (click)="closeFiltersModal()"></button>
    </div>
    <div class="program-filter-modal__body">
      <vmc-program-filters (filter)="onFiltersSelected($event)"></vmc-program-filters>
    </div>
  </div>
</ng-template>

<div class="container-fluid printer-shell" [class.viewer-modal]="isModal" [class.viewer-page]="!isModal">
  @if (isModal) {
  <div class="viewer-titlebar">
    <span class="viewer-titlebar__title"><i class="pi pi-file-pdf"></i> Programa semanal</span>
    <button class="viewer-titlebar__close" type="button" aria-label="Cerrar" (click)="onCLose()">
      <i class="pi pi-times"></i>
    </button>
  </div>
  }

  <button type="button" class="printer-filter-fab" title="Buscar programas" aria-label="Buscar programas por fecha"
    (click)="openFiltersModal(filtersModal)">
    <i class="pi pi-calendar"></i>
    <i class="pi pi-search printer-filter-fab__search"></i>
  </button>

  <div class="row pdf-viewer-row">
    <div class="col-12 pdf-viewer-shell">
      <ng2-pdfjs-viewer [fullScreen]="true" [zoom]="'auto'" [print]="true" [showSpinner]="true" #pdfViewerAutoLoad>
      </ng2-pdfjs-viewer>
    </div>
  </div>
</div>
