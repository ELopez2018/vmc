<div class="container">
        <div class="row pt-4">
          <div class="col-md-12" style="height: 90vh">
            <ng2-pdfjs-viewer
              [fullScreen]="true"
              [zoom]="'page-width'"
              [print]="true"
              [showSpinner]="true"
              #pdfViewerAutoLoad
            ></ng2-pdfjs-viewer>
          </div>
        </div>
        <button class="btn btn-info" (click)="download()" type="button">descargar pdf</button>
</div>
