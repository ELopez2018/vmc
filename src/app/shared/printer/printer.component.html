<div class="container-fluid">
  <div class="row">
    <div class="col-md-12 d-flex justify-content-end pe-2">
      <vmc-icon-close (click)="onCLose()"></vmc-icon-close>
    </div>
  </div>
  <div class="row">
    <div class="col-md-12" style="height: 85vh">
      <ng2-pdfjs-viewer
        [fullScreen]="true"
        [zoom]="'page-width'"
        [print]="true"
        [showSpinner]="true"
        #pdfViewerAutoLoad
      ></ng2-pdfjs-viewer>
    </div>
  </div>
</div>
